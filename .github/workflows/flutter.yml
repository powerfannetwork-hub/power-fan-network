name: Flutter CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # ==========================================
      # FLUTTER VERSION
      # ==========================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Flutter Pub Get
        run: flutter pub get

      # ==========================================
      # ANALYZE
      #
      # Current messages are INFO-level const
      # suggestions. They must not stop the APK build.
      # ==========================================
      - name: Flutter Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
