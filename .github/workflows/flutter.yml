name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Precache Android
        run: flutter precache --android

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      - name: Create Gradle Wrapper 8.13
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew --version

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
