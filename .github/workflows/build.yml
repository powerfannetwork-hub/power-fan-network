name: Build POWER FAN NETWORK APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Enable AndroidX
        working-directory: android
        run: |
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      - name: Generate Gradle Wrapper 8.13
        run: |
          gradle -p android wrapper --gradle-version 8.13

      - name: Verify Gradle Version
        working-directory: android
        run: ./gradlew --version

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
