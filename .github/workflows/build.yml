name: Build Power Fan Network APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.27.4"
      GRADLE_VERSION: "8.13"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Gradle ==="
          gradle --version

      - name: Flutter Doctor
        shell: bash
        run: |
          set -e
          flutter doctor -v

      - name: Flutter Clean and Pub Get
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Create Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CREATING GRADLE WRAPPER"
          echo "======================================"

          TEMP_GRADLE_DIR="$RUNNER_TEMP/gradle-wrapper-project"

          rm -rf "$TEMP_GRADLE_DIR"
          mkdir -p "$TEMP_GRADLE_DIR"

          cd "$TEMP_GRADLE_DIR"

          printf '%s\n' \
            "plugins {" \
            "    id 'base'" \
            "}" \
            > build.gradle

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-validate-url \
            --no-daemon

          cd "$GITHUB_WORKSPACE"

          mkdir -p android/gradle/wrapper

          cp "$TEMP_GRADLE_DIR/gradlew" android/gradlew
          cp "$TEMP_GRADLE_DIR/gradlew.bat" android/gradlew.bat
          cp "$TEMP_GRADLE_DIR/gradle/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/gradle-wrapper.jar
          cp "$TEMP_GRADLE_DIR/gradle/wrapper/gradle-wrapper.properties" \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "Gradle wrapper created successfully."

          echo "=== Wrapper files ==="
          ls -lh android/gradlew
          ls -lh android/gradlew.bat
          ls -lh android/gradle/wrapper/

      - name: Verify Gradle Wrapper
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING GRADLE WRAPPER"
          echo "======================================"

          ./gradlew --version

      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^org.gradle.vfs.watch=false" android/gradle.properties; then
            echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          fi

      - name: Configure Release Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking Android release signing secrets..."

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Creating release keystore..."

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/powerfan-release.jks

          if [ ! -s android/app/powerfan-release.jks ]; then
            echo "ERROR: Release keystore file was not created."
            exit 1
          fi

          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=powerfan-release.jks" \
            > android/key.properties

          if [ ! -s android/key.properties ]; then
            echo "ERROR: key.properties was not created."
            exit 1
          fi

          echo "Release signing configuration created successfully."

      - name: Verify Android Configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID CONFIGURATION"
          echo "======================================"

          grep -n "namespace" android/app/build.gradle.kts || true
          grep -n "applicationId" android/app/build.gradle.kts || true
          grep -n "compileSdk" android/app/build.gradle.kts || true
          grep -n "targetSdk" android/app/build.gradle.kts || true
          grep -n "minSdk" android/app/build.gradle.kts || true

          echo "======================================"
          echo "GRADLE WRAPPER"
          echo "======================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "======================================"
          echo "SIGNING FILES"
          echo "======================================"

          test -s android/app/powerfan-release.jks
          test -s android/key.properties

          ls -lh android/app/powerfan-release.jks
          ls -lh android/key.properties

      - name: Flutter Analyze
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING RELEASE APK"
          echo "======================================"

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: power-fan-network-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
