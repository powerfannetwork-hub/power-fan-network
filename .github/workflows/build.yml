name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix Gradle Wrapper Location
        shell: bash
        run: |
          set -e

          cd android

          mkdir -p gradle/wrapper

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew

          echo "Generated Gradle Wrapper:"
          ls -la
          ls -la gradle/wrapper

          echo "Wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      - name: Force AppLovin MAX compileSdk to 36
        shell: bash
        run: |
          set -e

          APPLOVIN_DIR="$HOME/.pub-cache/hosted/pub.dev/applovin_max-4.6.4/android"

          if [ ! -d "$APPLOVIN_DIR" ]; then
            echo "AppLovin MAX directory not found:"
            echo "$APPLOVIN_DIR"
            exit 1
          fi

          BUILD_FILE="$APPLOVIN_DIR/build.gradle"

          if [ -f "$BUILD_FILE" ]; then
            sed -i \
              -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
              "$BUILD_FILE"

            sed -i \
              -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
              "$BUILD_FILE"

            echo "Updated AppLovin build.gradle:"
            cat "$BUILD_FILE"
          else
            echo "AppLovin build.gradle not found."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release
          path: build/app/outputs/flutter-apk/app-release.apk
