name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Preparing Gradle wrapper..."

          mkdir -p gradle/wrapper

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew

          echo "Gradle wrapper created successfully."
          ./gradlew --version

      - name: Fix Flutter 3.24 Color API Compatibility
        shell: bash
        run: |
          set -e

          echo "Searching all Dart files for withValues()..."

          FILES=$(grep -RIl --include="*.dart" "\.withValues(" lib || true)

          if [ -z "$FILES" ]; then
            echo "No withValues() found."
          else
            echo "Files containing withValues():"
            echo "$FILES"

            for file in $FILES; do
              echo "Fixing: $file"

              python3 - "$file" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = r'\.withValues\(\s*alpha\s*:\s*([^,\)]+)\s*,?\s*\)'

          text = re.sub(
              pattern,
              r'.withOpacity(\1)',
              text,
              flags=re.MULTILINE,
          )

          pattern_single = r'\.withValues\(\s*alpha\s*:\s*([^,\)]+)\s*\)'

          text = re.sub(
              pattern_single,
              r'.withOpacity(\1)',
              text,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY
            done
          fi

          echo "Checking for remaining withValues()..."

          if grep -RIn --include="*.dart" "\.withValues(" lib; then
            echo "ERROR: withValues() still exists in the Dart source."
            exit 1
          fi

          echo "SUCCESS: No withValues() remains."

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e

          echo "Configuring application compileSdk and targetSdk..."

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' \
              android/app/build.gradle.kts

            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          echo "Application Android SDK configuration:"
          grep -nE "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle.kts || true

      - name: Fix AppLovin MAX Compile SDK
        shell: bash
        run: |
          set -e

          echo "Locating applovin_max Android module..."

          APPLOVIN_DIR=$(find "$HOME/.pub-cache" \
            -type d \
            -path "*/hosted/pub.dev/applovin_max-*/android" \
            | head -n 1)

          if [ -z "$APPLOVIN_DIR" ]; then
            echo "ERROR: applovin_max Android module was not found."
            exit 1
          fi

          echo "Found AppLovin Android module:"
          echo "$APPLOVIN_DIR"

          BUILD_FILE="$APPLOVIN_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$APPLOVIN_DIR/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: AppLovin build.gradle/build.gradle.kts not found."
            exit 1
          fi

          echo "Using build file:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          original = text

          # Groovy:
          # compileSdkVersion 31
          # compileSdkVersion 34
          text = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              text
          )

          # Kotlin DSL:
          # compileSdk = 31
          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              text
          )

          # Some Android library projects use:
          # compileSdkVersion flutter.compileSdkVersion
          text = re.sub(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              text
          )

          if text == original:
              print("WARNING: No existing compileSdk declaration was replaced.")
              print("Showing Android build file:")
              print(text)
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("SUCCESS: AppLovin MAX compileSdk patched to 36.")
          PY

          echo "Final AppLovin compileSdk configuration:"
          grep -nE "compileSdk|compileSdkVersion" "$BUILD_FILE" || true

      - name: Analyze Flutter Project
        run: flutter analyze

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
