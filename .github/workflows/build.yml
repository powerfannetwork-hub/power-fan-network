name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo "Checking Android project:"
          ls -la android

          echo "Checking existing wrapper files:"

          if [ -f "android/gradlew" ]; then
            echo "android/gradlew already exists."
          else
            echo "android/gradlew does not exist."
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Correct wrapper properties already exist."
          else
            echo "Wrapper properties do not exist at expected location."
          fi

          cd android

          mkdir -p gradle/wrapper

          echo "Generating Gradle Wrapper 8.13..."

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew

          echo "Generated wrapper files:"
          ls -la
          ls -la gradle/wrapper

          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle Wrapper version:"
          ./gradlew --version

      - name: Fix Flutter 3.24 Color API Compatibility
        shell: bash
        run: |
          set -e

          echo "Searching all Dart files for withValues()..."

          FILES=$(grep -RIl \
            --include="*.dart" \
            "\.withValues(" \
            lib || true)

          if [ -z "$FILES" ]; then
            echo "No withValues() usage found."
          else
            echo "Files containing withValues():"
            echo "$FILES"

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              echo "Fixing: $file"

              sed -i \
                -E 's/\.withValues\([[:space:]]*alpha:[[:space:]]*/.withOpacity(/g' \
                "$file"

            done <<< "$FILES"
          fi

          echo "Checking for remaining withValues()..."

          if grep -RIn \
            --include="*.dart" \
            "\.withValues(" \
            lib; then

            echo "ERROR: withValues() still exists in the Dart source."
            exit 1
          fi

          echo "SUCCESS: No withValues() usages remain."

      - name: Force AppLovin MAX compileSdk to 36
        shell: bash
        run: |
          set -e

          APPLOVIN_DIR="$HOME/.pub-cache/hosted/pub.dev/applovin_max-4.6.4/android"

          if [ ! -d "$APPLOVIN_DIR" ]; then
            echo "AppLovin MAX directory not found:"
            echo "$APPLOVIN_DIR"
            exit 1
          fi

          echo "AppLovin MAX directory found:"
          echo "$APPLOVIN_DIR"

          BUILD_FILE="$APPLOVIN_DIR/build.gradle"

          if [ -f "$BUILD_FILE" ]; then

            echo "Original AppLovin build.gradle:"
            cat "$BUILD_FILE"

            sed -i \
              -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
              "$BUILD_FILE"

            sed -i \
              -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
              "$BUILD_FILE"

            echo "Updated AppLovin build.gradle:"
            cat "$BUILD_FILE"

          else
            echo "AppLovin build.gradle not found."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
