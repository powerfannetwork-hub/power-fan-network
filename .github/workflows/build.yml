name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.27.4"
      GRADLE_VERSION: "8.13"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Gradle ==="
          gradle --version

      - name: Flutter Doctor
        shell: bash
        run: |
          set -e
          flutter doctor -v

      - name: Flutter Clean and Pub Get
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: android
        run: |
          set -e

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew

      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^org.gradle.vfs.watch=false" android/gradle.properties; then
            echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          fi

      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -e

          echo "=== Android app configuration ==="

          grep -n "compileSdk" android/app/build.gradle.kts || true
          grep -n "targetSdk" android/app/build.gradle.kts || true
          grep -n "minSdk" android/app/build.gradle.kts || true

          echo "=== Android root configuration ==="

          grep -n "compileSdk" android/build.gradle.kts || true

      - name: Flutter Analyze
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK files generated:"
          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
