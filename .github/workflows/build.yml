name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:  
      FLUTTER_VERSION: "3.24.0"  
      GRADLE_VERSION: "8.13"  
      JAVA_VERSION: "17"  
      ANDROID_COMPILE_SDK: "35"  # <-- Na sauke shi zuwa 35. 36 bai fito ba tukuna

    steps:  

      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Setup Java 17  
        uses: actions/setup-java@v4  
        with:  
          distribution: temurin  
          java-version: ${{ env.JAVA_VERSION }}  
          cache: gradle  

      - name: Setup Flutter  
        uses: subosito/flutter-action@v2  
        with:  
          flutter-version: ${{ env.FLUTTER_VERSION }}  
          channel: stable  
          cache: true  

      - name: Setup Gradle 8.13  
        uses: gradle/actions/setup-gradle@v4  
        with:  
          gradle-version: ${{ env.GRADLE_VERSION }}  

      - name: Check build environment  
        shell: bash  
        run: |  
          set -e  
          echo "Java:" && java -version  
          echo "Flutter:" && flutter --version  
          echo "Gradle:" && gradle --version  

      - name: Flutter Doctor  
        shell: bash  
        run: flutter doctor -v  

      - name: Flutter Pub Get  
        shell: bash  
        run: |  
          set -e  
          flutter clean  
          flutter pub get  

      - name: Prepare Gradle Wrapper  
        shell: bash  
        working-directory: android  
        run: |  
          set -e  
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin --no-validate-url  
          chmod +x gradlew  

      - name: Configure Gradle for CI  
        shell: bash  
        run: |  
          set -e  
          if ! grep -q "^org.gradle.vfs.watch=false" android/gradle.properties 2>/dev/null; then  
            echo "org.gradle.vfs.watch=false" >> android/gradle.properties  
          fi  

      - name: Force Android compileSdk 35  
        shell: bash  
        run: |  
          set -e  
          python3 <<'PY'
          from pathlib import Path
          import re
          files = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          for path in files:
              if not path.exists(): continue
              text = path.read_text()
              text = re.sub(r'compileSdkVersion\s+["\']?3[1-5]["\']?', 'compileSdkVersion 35', text)
              text = re.sub(r'compileSdk\s*=\s*3[1-5]\b', 'compileSdk = 35', text)
              path.write_text(text)
          PY

      - name: Fix AppLovin MAX compileSdk  
        shell: bash  
        run: |  
          set -e  
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"  
          APPLOVIN_DIRS=$(find "$CACHE_DIR" -type d -path "*/hosted/pub.dev/applovin_max-*" 2>/dev/null || true)  
          for APPLOVIN_DIR in $APPLOVIN_DIRS; do  
            find "$APPLOVIN_DIR/android" -name "*.gradle*" -exec sed -i 's/compileSdkVersion 3[1-5]/compileSdkVersion 35/g; s/compileSdk = 3[1-5]/compileSdk = 35/g' {} \;  
          done  

      - name: Fix Flutter 3.24 Color API  
        shell: bash  
        run: |  
          set -e  
          find lib -name "*.dart" -exec sed -i 's/\.withValues(alpha:/\.withOpacity(/g' {} \;  

      - name: Flutter Analyze  
        shell: bash  
        run: flutter analyze  

      - name: Build Release APK  
        shell: bash  
        run: |  
          set -e  
          flutter build apk --release --android-skip-build-dependency-validation  

      - name: Upload Release APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: power-fan-network-release-apk  
          path: build/app/outputs/flutter-apk/*.apk  
          if-no-files-found: error  
          retention-days: 30
