name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Preparing Gradle wrapper..."

          mkdir -p gradle/wrapper

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew

          ./gradlew --version

      - name: Fix Flutter 3.24 Color API Compatibility
        shell: bash
        run: |
          set -e

          echo "Searching Dart files for withValues()..."

          FILES=$(grep -RIl --include="*.dart" "\.withValues(" lib || true)

          if [ -n "$FILES" ]; then
            for file in $FILES; do
              echo "Fixing: $file"

              python3 - "$file" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = r'\.withValues\(\s*alpha\s*:\s*([^,\)]+)\s*,?\s*\)'

          text = re.sub(
              pattern,
              r'.withOpacity(\1)',
              text,
              flags=re.MULTILINE,
          )

          pattern_single = r'\.withValues\(\s*alpha\s*:\s*([^,\)]+)\s*\)'

          text = re.sub(
              pattern_single,
              r'.withOpacity(\1)',
              text,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY
            done
          fi

          if grep -RIn --include="*.dart" "\.withValues(" lib; then
            echo "ERROR: withValues() still exists."
            exit 1
          fi

          echo "SUCCESS: No withValues() remains."

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e

          echo "Configuring application SDK..."

          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            android/app/build.gradle.kts

          sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 36/g' \
            android/app/build.gradle.kts

          echo "Application SDK:"
          grep -nE "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle.kts || true

      - name: Force AppLovin MAX Compile SDK 36
        shell: bash
        run: |
          set -e

          echo "Searching ALL AppLovin MAX Android modules..."

          APPLOVIN_DIRS=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -type d \
            -path "*/applovin_max-*/android" \
            2>/dev/null || true)

          if [ -z "$APPLOVIN_DIRS" ]; then
            echo "ERROR: AppLovin MAX Android module was not found."
            exit 1
          fi

          echo "Found AppLovin directories:"
          echo "$APPLOVIN_DIRS"

          for DIR in $APPLOVIN_DIRS; do
            echo ""
            echo "========================================"
            echo "Patching AppLovin:"
            echo "$DIR"
            echo "========================================"

            find "$DIR" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            GRADLE_FILES=$(find "$DIR" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print)

            for FILE in $GRADLE_FILES; do
              echo "Patching: $FILE"

              python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          original = text

          # Groovy:
          # compileSdkVersion 31
          # compileSdkVersion flutter.compileSdkVersion
          text = re.sub(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              text
          )

          # Kotlin DSL:
          # compileSdk = 31
          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              text
          )

          # Kotlin DSL alternative:
          # compileSdkVersion(31)
          text = re.sub(
              r'compileSdkVersion\s*\(\s*\d+\s*\)',
              'compileSdkVersion(36)',
              text
          )

          # Groovy alternative:
          # compileSdkVersion(31)
          text = re.sub(
              r'compileSdkVersion\s*\(\s*\d+\s*\)',
              'compileSdkVersion(36)',
              text
          )

          if text != original:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("PATCHED:", path)
          else:
              print("No compileSdk declaration changed in:", path)
          PY
            done
          done

          echo ""
          echo "Verifying EVERY AppLovin Gradle file..."

          for DIR in $APPLOVIN_DIRS; do
            echo ""
            echo "Checking:"
            echo "$DIR"

            grep -RInE \
              "compileSdkVersion|compileSdk[[:space:]]*=" \
              "$DIR" \
              --include="build.gradle" \
              --include="build.gradle.kts" \
              || true
          done

          echo ""
          echo "Searching for AppLovin Android compileSdk 31..."

          if grep -RInE \
            "compileSdkVersion[[:space:]]+31|compileSdk[[:space:]]*=[[:space:]]*31" \
            $APPLOVIN_DIRS \
            --include="build.gradle" \
            --include="build.gradle.kts"; then

            echo "ERROR: AppLovin MAX still contains compileSdk 31."
            exit 1
          fi

          echo "SUCCESS: AppLovin MAX compileSdk 31 declarations were removed."

      - name: Clean Android Build
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon

      - name: Analyze Flutter Project
        run: flutter analyze

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
