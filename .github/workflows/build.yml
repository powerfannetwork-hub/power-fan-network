name: Build Power Fan Network APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.27.4"
      GRADLE_VERSION: "8.13"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 3. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ============================================================
      # 4. Setup Gradle 8.13
      # ============================================================
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 5. Check build environment
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Gradle ==="
          gradle --version


      # ============================================================
      # 6. Flutter Doctor
      # ============================================================
      - name: Flutter Doctor
        shell: bash
        run: |
          set -e
          flutter doctor -v


      # ============================================================
      # 7. Clean and Pub Get
      # ============================================================
      - name: Flutter Clean and Pub Get
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get


      # ============================================================
      # 8. Prepare Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: android
        run: |
          set -e

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-validate-url

          chmod +x gradlew


      # ============================================================
      # 9. Configure Gradle for CI
      # ============================================================
      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^org.gradle.vfs.watch=false" android/gradle.properties; then
            echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          fi


      # ============================================================
      # 10. Configure Release Keystore
      # ============================================================
      - name: Configure Release Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking Android release signing secrets..."

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Creating release keystore..."

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/powerfan-release.jks

          if [ ! -s android/app/powerfan-release.jks ]; then
            echo "ERROR: Release keystore file was not created."
            exit 1
          fi

          echo "Creating android/key.properties..."

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=powerfan-release.jks
          EOF

          echo "Release signing configuration created successfully."

          echo "Checking signing files..."

          test -s android/app/powerfan-release.jks
          test -s android/key.properties

          echo "Keystore and key.properties are ready."


      # ============================================================
      # 11. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "=== Android app configuration ==="

          grep -n "namespace" android/app/build.gradle.kts || true
          grep -n "applicationId" android/app/build.gradle.kts || true
          grep -n "compileSdk" android/app/build.gradle.kts || true
          grep -n "targetSdk" android/app/build.gradle.kts || true
          grep -n "minSdk" android/app/build.gradle.kts || true

          echo "=== Release signing configuration ==="

          grep -n "signingConfigs" android/app/build.gradle.kts || true
          grep -n "signingConfig" android/app/build.gradle.kts || true

          echo "=== Keystore file ==="

          ls -lh android/app/powerfan-release.jks

          echo "=== key.properties exists ==="

          ls -lh android/key.properties


      # ============================================================
      # 12. Flutter Analyze
      # ============================================================
      - name: Flutter Analyze
        shell: bash
        run: |
          set -e
          flutter analyze


      # ============================================================
      # 13. Build Release APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation


      # ============================================================
      # 14. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          echo "APK files generated:"

          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
