name: Build POWER FAN NETWORK APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # Important:
      # Download Flutter Android engine artifacts before Gradle starts.
      - name: Precache Flutter Android artifacts
        run: flutter precache --android

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings || true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor
          flutter precache --android

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: power-fan-network-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
