name: power_fan_network
description: POWER FAN NETWORK - A decentralized fan mining network.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.10.3

  # State / Utilities
  provider: ^6.1.5+1
  intl: ^0.20.2
  shared_preferences: ^2.5.3

  # Device
  device_info_plus: ^12.1.0
  package_info_plus: ^8.3.1

  # Networking
  http: ^1.5.0
  url_launcher: ^6.3.2

  # Social / Sharing
  share_plus: ^12.0.1

  # Images / Camera
  image_picker: ^1.2.0

  # Notifications
  flutter_local_notifications: ^19.4.1

  # Ads
  levelplay_mediation: ^9.1.0

  # Didit Identity Verification
  # Automatic document/face capture without NFC.
  # 4.9.0 pins the matching native Android/iOS SDKs.
  didit_sdk_autodetection: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#3B159B"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
